media:
  input: .
  output: .

content:
  - name: site
    label: 基本情報
    type: file
    path: content.json
    format: json
    fields:
      - name: site
        label: 基本プロフィール
        type: object
        fields:
          - {name: name_ja, label: 名前, type: string}
          - {name: name_en, label: 英語表記, type: string}
          - {name: affiliation, label: 所属, type: string}
          - {name: position, label: 職名, type: string}
          - {name: email, label: 問い合わせメール, type: string}
          - {name: orcid, label: ORCID, type: string}
          - {name: google_scholar, label: Google Scholar, type: string}
          - {name: researchmap, label: researchmap, type: string}
      - name: profile
        label: プロフィール
        type: object
        fields:
          - {name: summary, label: トップページの紹介文, type: text}
          - {name: research, label: 研究について, type: text}
          - {name: activities, label: 現在の活動, type: text}
      - name: research_themes
        label: 研究テーマ
        type: object
        list: true
        fields:
          - {name: title, label: テーマ名, type: string}
          - {name: description, label: 説明, type: text}
      - name: activities
        label: 活動
        type: object
        list: true
        fields:
          - {name: year, label: 年, type: string}
          - {name: category, label: 分類, type: string}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明, type: text}
          - {name: link_label, label: リンクに表示する文字, type: string}
          - {name: url, label: リンク先URL, type: string}
      - name: publications
        label: 書籍・論文
        type: object
        list: true
        fields:
          - {name: type, label: 種別, type: string}
          - {name: year, label: 年, type: string}
          - {name: title, label: タイトル, type: string}
          - {name: citation, label: 書誌情報・説明, type: text}
          - {name: description, label: 一般向け説明, type: text}
          - {name: link_label, label: リンクに表示する文字, type: string}
          - {name: url, label: リンク先URL, type: string}
      - name: presentations
        label: 講演・研究発表
        type: object
        list: true
        fields:
          - {name: year, label: 年, type: string}
          - {name: event, label: 種別・イベント名, type: string}
          - {name: title, label: 発表タイトル, type: string}
          - {name: place, label: 開催場所・学会名, type: string}
          - {name: description, label: 説明, type: text}
          - {name: link_label, label: リンクに表示する文字, type: string}
          - {name: url, label: リンク先URL, type: string}
      - name: teaching
        label: 授業
        type: object
        list: true
        fields:
          - {name: year, label: 年度, type: string}
          - {name: institution, label: 大学・機関, type: string}
          - {name: course, label: 授業名, type: string}
          - {name: description, label: 説明, type: text}
          - {name: link_label, label: リンクに表示する文字, type: string}
          - {name: url, label: シラバス等のURL, type: string}
      - name: news
        label: お知らせ
        type: object
        list: true
        fields:
          - {name: date, label: 日付, type: string}
          - {name: title, label: タイトル, type: string}
          - {name: description, label: 説明, type: text}
          - {name: link_label, label: リンクに表示する文字, type: string}
          - {name: url, label: リンク先URL, type: string}
